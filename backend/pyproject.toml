[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gc-chart-backend"
version = "0.1.0"
description = "Backend for the GC (Gold) futures TradingView-like charting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[project.scripts]
gc-backend = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    # Property-based tests (Hypothesis). Each maps to exactly one design property.
    # Convention: tag the test with @pytest.mark.property and include a module/test
    # comment tag in the exact format documented in tests/README.md:
    #   Feature: gc-chart-platform, Property {n}: {property_text}
    "property: property-based test validating one design property (Properties 1-31)",
    "unit: example-based unit test",
    "integration: transport/wiring integration test",
    "smoke: one-time setup / configuration smoke test",
]
